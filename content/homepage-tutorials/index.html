<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pic365 真实场景课堂</title>
  <style>
    :root{color-scheme:dark;--bg:#05080d;--card:#0d1725;--line:#263a50;--text:#f6fbff;--muted:#9cafc7;--green:#76f4a7}*{box-sizing:border-box}body{margin:0;color:var(--text);background:radial-gradient(circle at 15% 0%,#122c3b 0,transparent 34%),var(--bg);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 36px));margin:auto}.top{position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(118,244,167,.2);background:rgba(5,8,13,.9);backdrop-filter:blur(16px)}.top .wrap{min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{font-size:20px;font-weight:850}.back{min-height:42px;padding:0 16px;border:1px solid var(--line);border-radius:21px;display:inline-flex;align-items:center;color:#fff;background:#0c1624;text-decoration:none}.hero{padding:66px 0 38px}.kicker{color:var(--green);font-weight:800}.hero h1{margin:14px 0;font-size:clamp(40px,6vw,66px);line-height:1.08}.hero p{max-width:720px;margin:0;color:#c1cddd;font-size:18px;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;padding:28px 0 80px}.card{min-width:0;overflow:hidden;border:1px solid var(--line);border-radius:24px;color:inherit;background:rgba(13,23,37,.9);text-decoration:none;transition:.16s}.card:hover{border-color:var(--green);transform:translateY(-3px)}.card:focus-visible{outline:3px solid rgba(118,244,167,.5);outline-offset:3px}.image{aspect-ratio:4/3;overflow:hidden;background:#08111f}.image img{width:100%;height:100%;display:block;object-fit:cover}.copy{padding:20px}.copy small{color:var(--green);font-weight:800}.copy h2{margin:9px 0;font-size:21px}.copy p{min-height:64px;margin:0;color:var(--muted);font-size:14px;line-height:1.65}.meta{display:flex;justify-content:space-between;gap:12px;margin-top:17px;color:#c9d6e4;font-size:12px}.empty{padding:40px;border:1px solid var(--line);border-radius:24px;color:var(--muted);background:var(--card)}@media(max-width:860px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.wrap{width:calc(100% - 24px)}.top .wrap{align-items:flex-start;flex-direction:column;padding-block:12px}.grid{grid-template-columns:1fr}.hero{padding-top:45px}.hero h1{font-size:40px}.copy p{min-height:0}}
  </style>
  <link rel="stylesheet" href="./tutorial-theme.css"><script src="./tutorial-theme.js"></script>
</head>
<body>
  <header class="top"><div class="wrap"><div class="brand">Pic365 真实场景课堂</div><a class="back" href="/#home">返回 Pic365 首页</a></div></header>
  <main class="wrap"><section class="hero"><span class="kicker">真实问题 · 真实步骤 · 真实结果</span><h1>选择一个场景，照着完成第一次创作</h1><p>每套教程都包含准备素材、Pic365 操作步骤、结果对比、常见错误和下一步入口。</p></section><section class="grid" id="tutorialGrid" aria-live="polite"></section></main>
  <script>
    const grid=document.getElementById('tutorialGrid');
    const local=['127.0.0.1','localhost'].includes(location.hostname);
    fetch('./index.json',{cache:'no-store'}).then(r=>r.json()).then(data=>{
      const items=(data.items||[]).filter(item=>item.enabled||(local&&item.status==='review')).sort((a,b)=>a.order-b.order);
      if(!items.length){grid.innerHTML='<div class="empty">教程正在完成授权和上线检查，暂未公开。</div>';return}
      grid.innerHTML=items.map(item=>`<a class="card" href="./${item.slug}/index.html"><div class="image"><img src="./${item.cover}" alt="${item.title}" loading="lazy"></div><div class="copy"><small>${item.category}</small><h2>${item.title}</h2><p>${item.summary||''}</p><div class="meta"><span>${item.durationMinutes} 分钟学会</span><b>查看教程 →</b></div></div></a>`).join('');
    }).catch(()=>{grid.innerHTML='<div class="empty">教程索引暂时无法读取，请稍后重试。</div>'});
  </script>
</body>
</html>
